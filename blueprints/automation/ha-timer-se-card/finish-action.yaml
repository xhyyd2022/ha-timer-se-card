blueprint:
  name: "Timer SE Card: 倒计时结束动作"
  description: |
    配合 Timer SE Card 的 HA 服务端计时模式(timer_entity)使用。

    只需设置两项输入:倒计时用的 Timer 辅助实体、以及到点要操作的实体。
    倒计时时长、开始/暂停/继续/取消仍由前端卡片每次动态控制;
    卡片每次开始时会自动 trigger/start 所选 Timer,本自动化在到点(timer.finished)后执行动作。
    页面/浏览器关闭时也能准确到点执行。
  domain: automation
  source_url: >-
    https://github.com/xhyyd2022/ha-timer-se-card/blob/main/blueprints/automation/ha-timer-se-card/finish-action.yaml
  input:
    timer_entity:
      name: 倒计时 Timer 实体
      description: >-
        卡片配置里 timer_entity 填写的那个 Timer 辅助实体
        (HA:设置 → 设备与服务 → 辅助元素 → 计时器)
      selector:
        entity:
          domain: timer
    target_entity:
      name: 结束动作目标实体
      description: 倒计时到点后要操作的实体,例如灯光/开关
      selector:
        entity: {}
    end_action:
      name: 结束动作
      description: 到点后对目标实体做什么(默认关闭)
      default: turn_off
      selector:
        select:
          options:
            - label: 关闭
              value: turn_off
            - label: 开启
              value: turn_on
            - label: 切换
              value: toggle

triggers:
  - trigger: timer.finished
    target:
      entity_id: !input timer_entity

conditions: []

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ end_action == 'turn_on' }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input target_entity
      - conditions:
          - condition: template
            value_template: "{{ end_action == 'toggle' }}"
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: !input target_entity
      # 默认:关闭
      - default:
          - action: homeassistant.turn_off
            target:
              entity_id: !input target_entity
mode: single

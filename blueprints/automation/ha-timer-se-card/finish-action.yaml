blueprint:
  name: "Timer SE Card: 倒计时结束动作"
  description: |
    配合 Timer SE Card 的 HA 服务端计时模式(timer_entity)使用。

    蓝图、卡片与自动化共用**同一个 Timer 辅助实体**:卡片把时间参数传给
    timer.start 开始服务端倒计时;到点(timer.finished)后本自动化执行结束动作。
    页面/浏览器关闭时同样准确到点。
  domain: automation
  source_url: >-
    https://github.com/xhyyd2022/ha-timer-se-card/blob/main/blueprints/automation/ha-timer-se-card/finish-action.yaml
  input:
    timer_entity:
      name: 倒计时 Timer 实体
      description: >-
        辅助实体里的 Timer,与卡片配置 timer_entity 一致
        (HA:设置 → 设备与服务 → 辅助元素 → 计时器)
      selector:
        entity:
          domain: timer
    target_entity:
      name: 结束动作目标实体
      description: >-
        到点要操作的真实设备实体(灯/开关/风扇等,已按类型筛选);
        若要操作输入类辅助实体或未列出的域,可改在"其他实体"中手动填写
      selector:
        entity:
          domain:
            - light
            - switch
            - fan
            - cover
            - climate
            - media_player
            - humidifier
            - water_heater
            - vacuum
            - lock
            - siren
            - valve
    end_action:
      name: 结束动作
      description: 到点后对目标实体做什么(默认关闭)
      default: turn_off
      selector:
        select:
          options:
            - label: 关闭
              value: turn_off
            - label: 开启
              value: turn_on
            - label: 切换
              value: toggle

triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity

conditions: []

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ end_action == 'turn_on' }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input target_entity
      - conditions:
          - condition: template
            value_template: "{{ end_action == 'toggle' }}"
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: !input target_entity
    default:
      - action: homeassistant.turn_off
        target:
          entity_id: !input target_entity
mode: single

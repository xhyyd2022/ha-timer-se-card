name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version from tag
        id: ver
        run: echo "num=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci || npm install

      # 版本号以 git tag 为准,注入 __VERSION__ 后编译进 dist 产物
      - name: Build
        run: npm run build
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.num }}

      # HA 前端卡片标准:Release 只附一个与仓库同名、可直接加载的模块 JS
      # (HACS Plugin 类型会扫描该产物;版本号体现在 tag/Release,而非文件名)
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ha-timer-se-card.js
          generate_release_notes: true
